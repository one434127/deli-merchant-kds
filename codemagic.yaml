workflows:
  android-merchant-kds:
    name: Deli Merchant KDS Android Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    scripts:
      - name: Set up Gradle Wrapper & Build Debug APK
        script: |
          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk

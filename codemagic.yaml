workflows:
  android-merchant-kds:
    name: Deli Merchant KDS Android Build
    max_build_duration: 30
    instance_type: linux_x2
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Set up Gradle Wrapper & Build Debug APK
        script: |
          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk

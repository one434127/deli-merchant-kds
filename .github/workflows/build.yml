name: Fast Android KDS Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle with Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Push APK directly to Oracle Server
        run: |
          curl -X PUT http://158.101.96.169:3000/api/upload-kds-apk \
            -H "x-kds-key: deli-kds-deploy-2026" \
            --data-binary @app/build/outputs/apk/debug/app-debug.apk

      - name: Save APK in GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deli-merchant-kds
          path: app/build/outputs/apk/debug/app-debug.apk
